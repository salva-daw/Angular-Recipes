<div class="min-h-screen bg-gray-50">
  <header class="bg-white shadow-sm py-6 mb-8 border-b border-gray-100">
    <div class="container mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <a routerLink="/" 
         class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-600 tracking-tight hover:opacity-80 transition-opacity">
        {{ title() }}
      </a>
      
      <nav class="flex items-center gap-6">
        <a routerLink="/" 
           routerLinkActive="text-amber-600 font-bold border-b-2 border-amber-500"
           [routerLinkActiveOptions]="{exact: true}"
           class="text-gray-600 hover:text-amber-500 transition-colors py-1 px-2 text-sm uppercase tracking-wider">
          Explorar
        </a>
        <a routerLink="/add" 
           class="bg-amber-500 hover:bg-amber-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-md hover:shadow-lg transition-all flex items-center gap-2">
          <span>➕</span> Nueva Receta
        </a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 pb-12">
    <!-- Angular cargará aquí el componente que corresponda a la URL -->
    <router-outlet />
  </main>

  <app-toast-container />
</div>
