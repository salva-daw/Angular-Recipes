<div class="min-h-screen bg-gray-50">
  <header class="bg-white shadow-sm py-6 mb-8">
    <div class="container mx-auto px-4 text-center md:text-left">
      <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-600 tracking-tight">
        {{ title() }}
      </h1>
    </div>
  </header>

  <main class="container mx-auto px-4 pb-12">
    <!-- El detalle recibe la receta seleccionada -->
    <app-recipe-detail [recipe]="selectedRecipe()" />
    
    <div class="mt-12 pt-12 border-t border-gray-200">
      <header class="flex items-center justify-between mb-8 px-4">
        <h2 class="text-2xl font-bold text-gray-900">Descubre nuevas recetas</h2>
        <span class="text-sm text-gray-500 font-medium">Selecciona una para ver los pasos</span>
      </header>
      
      <!-- El listado avisa cuando se selecciona una receta o se marca favorita -->
      <app-recipe-list 
        (recipeSelected)="onRecipeSelected($event)" 
        (toggleFavorite)="handleToggleFavorite($event)" />
    </div>

    <router-outlet />
  </main>
</div>
