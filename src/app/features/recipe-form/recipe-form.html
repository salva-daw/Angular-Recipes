<section class="max-w-2xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden my-8 p-8 border border-gray-100">
  <div class="flex items-center justify-between mb-8">
    <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">
      Añadir Nueva Receta
    </h2>
    <a routerLink="/" class="text-gray-500 hover:text-amber-500 transition-colors">
      Cancelar
    </a>
  </div>

  <form [formGroup]="recipeForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Título -->
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-2">Título de la receta</label>
      <input type="text" formControlName="title"
             placeholder="Ej. Paella de Marisco"
             [class.border-red-500]="isFieldInvalid('title')"
             class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
      @if (isFieldInvalid('title')) {
        <p class="text-red-500 text-xs mt-2 font-medium">El título es obligatorio (mín. 3 caracteres)</p>
      }
    </div>

    <!-- Descripción -->
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-2">Descripción breve</label>
      <textarea formControlName="description" rows="3"
                placeholder="Cuéntanos un poco sobre este plato..."
                [class.border-red-500]="isFieldInvalid('description')"
                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all resize-none"></textarea>
      @if (isFieldInvalid('description')) {
        <p class="text-red-500 text-xs mt-2 font-medium">Por favor, escribe una descripción de al menos 10 caracteres</p>
      }
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Categoría -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Categoría</label>
        <select formControlName="category"
                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all appearance-none cursor-pointer">
          <option value="breakfast">Desayuno</option>
          <option value="lunch">Almuerzo</option>
          <option value="dinner">Cena</option>
          <option value="dessert">Postre</option>
        </select>
      </div>

      <!-- Puntuación -->
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-2">Puntuación (1-5)</label>
        <input type="number" formControlName="rating" min="1" max="5"
               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
      </div>
    </div>

    <!-- Botón Enviar -->
    <button type="submit" 
            [disabled]="recipeForm.invalid"
            class="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all disabled:opacity-50 disabled:translate-y-0 disabled:shadow-none">
      Crear Receta
    </button>
  </form>
</section>
