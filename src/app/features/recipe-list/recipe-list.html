<!-- Buscador -->
<div class="mb-8 px-4 max-w-2xl mx-auto">
  <div class="relative group">
    <span class="absolute inset-y-0 left-4 flex items-center text-gray-400 group-focus-within:text-amber-500 transition-colors">
      🔍
    </span>
    <input 
      type="text" 
      [value]="searchTerm()"
      (input)="updateSearch($event)"
      placeholder="Busca por nombre o categoría..."
      class="w-full pl-12 pr-4 py-4 bg-white border border-gray-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all text-gray-700"
    >
  </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-4">
  @for (recipe of filteredRecipes(); track recipe.id) {
    <article (click)="selectRecipe(recipe)" 
             animate.enter="fade-slide-up"
             [style.--index]="$index"
             class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl transition-all duration-300 border border-gray-100 flex flex-col h-full cursor-pointer hover:scale-[1.02]">
      @if (recipe.image) {
        <div class="relative h-48 w-full shrink-0">
          <img [ngSrc]="recipe.image" 
               [alt]="recipe.title" 
               fill
               class="object-cover"
               [priority]="$index === 0">
          <!-- Botón de Favorito -->
          <button (click)="onToggleFavorite($event, recipe)"
                  aria-label="Marcar como favorita"
                  class="absolute top-3 right-3 p-2 bg-white/80 backdrop-blur-sm rounded-full shadow-sm hover:bg-white transition-colors group/fav focus:ring-2 focus:ring-amber-500 outline-none">
            <span class="text-xl group-hover/fav:scale-110 transition-transform block" aria-hidden="true">❤️</span>
          </button>
        </div>
      }
      <div class="p-5 flex flex-col flex-grow">
        <span class="inline-block px-3 py-1 text-xs font-semibold text-gray-600 bg-gray-100 rounded-full uppercase tracking-wide mb-3 self-start">
          {{ recipe.category }}
        </span>
        <h3 class="text-xl font-bold text-gray-900 mb-2">{{ recipe.title }}</h3>
        <p class="text-gray-600 text-sm leading-relaxed mb-4">
          {{ recipe.description }}
        </p>
        
        <div class="flex items-center justify-between pt-4 border-t border-gray-100 mt-auto">
          <span class="flex items-center font-semibold text-amber-600">
            <span class="mr-1" aria-hidden="true">⭐</span> {{ recipe.rating }}
          </span>
          <button (click)="deleteRecipe($event, recipe)" 
                  aria-label="Eliminar receta"
                  class="px-4 py-2 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors duration-200 focus:ring-2 focus:ring-red-500 outline-none">
            Eliminar
          </button>
        </div>
      </div>
    </article>
  } @empty {
    <div class="col-span-full py-20 flex flex-col items-center justify-center text-center bg-gray-50 rounded-3xl border-2 border-dashed border-gray-200 animate-in fade-in duration-700">
      <div class="text-6xl mb-4">🍳</div>
      <h3 class="text-xl font-bold text-gray-900 mb-2">No encontramos lo que buscas</h3>
      <p class="text-gray-500 max-w-xs mx-auto mb-4">
        Prueba con otros ingredientes o limpia la búsqueda para ver todas las recetas.
      </p>
      <button (click)="searchTerm.set('')" 
              class="px-6 py-2 bg-amber-500 text-white font-semibold rounded-xl hover:bg-amber-600 transition-colors shadow-sm focus:ring-4 focus:ring-amber-500/20 outline-none">
        Limpiar búsqueda
      </button>
    </div>
  }
</div>
